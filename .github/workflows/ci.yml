name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Format
        working-directory: contracts
        run: forge fmt --check

      - name: Build
        working-directory: contracts
        run: forge build --sizes

      - name: Lint
        working-directory: contracts
        run: forge lint src/

      - name: Tests
        working-directory: contracts
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build
        working-directory: frontend
        run: |
          npm install
          npm run build
